apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: explorer-nginx
  namespace: default
spec:
  owner:
    projectName: fhir-canvas-explorer
    componentName: explorer-nginx
  endpoints:
    http:
      type: HTTP
      port: 8080
      visibility: [external]
  container:
    image: nginx:1.27-alpine
    env:
      - key: EXPLORER_WEB_UPSTREAM
        value: explorer-web:3000
    files:
      - key: explorer.conf.template
        mountPath: /etc/nginx/templates
        value: |
          server {
            listen       8080;
            server_name  _;
            client_max_body_size 2m;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
            add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
            add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

            location / {
              proxy_pass http://${EXPLORER_WEB_UPSTREAM};
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_buffering off;
              proxy_read_timeout 65s;
            }
          }
