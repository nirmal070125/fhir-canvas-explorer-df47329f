apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: explorer-nginx-workload
  namespace: default
spec:
  owner:
    projectName: fhir-canvas-explorer
    componentName: explorer-nginx
  endpoints:
    http:
      type: HTTP
      port: 8080
      visibility: [external]
  dependencies:
    endpoints:
      - component: explorer-web
        name: http
        visibility: project
        envBindings:
          host: EXPLORER_WEB_HOST
          port: EXPLORER_WEB_PORT
  container:
    image: nginx:1.27.5-alpine
    files:
      - key: explorer.conf.template
        mountPath: /etc/nginx/templates
        # value is injected from the repo-root nginx.conf at apply time — the
        # Workload CR only takes inline content, so a one-line yq render keeps
        # the config a real editable file. See openchoreo/README.md.
        value: RENDERED_FROM_nginx.conf
