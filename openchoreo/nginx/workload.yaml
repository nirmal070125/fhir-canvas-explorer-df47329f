apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: explorer-nginx-workload
  namespace: default
spec:
  owner:
    projectName: fhir-canvas-explorer
    componentName: explorer-nginx
  endpoints:
    http:
      type: HTTP
      port: 8080
      visibility: [external]
  dependencies:
    endpoints:
      - component: explorer-web
        name: http
        visibility: project
        envBindings:
          host: EXPLORER_WEB_HOST
          port: EXPLORER_WEB_PORT
  container:
    image: nginx:1.27.5-alpine
    files:
      - key: explorer.conf.template
        mountPath: /etc/nginx/templates
        value: |
          # The gateway's HTTPListenerPolicy (useRemoteAddress) makes Envoy set
          # x-envoy-external-address from the real socket peer and sanitize the
          # spoofable variants, so it is the trustworthy client address.
          map $http_x_envoy_external_address $client_ip {
            default $http_x_envoy_external_address;
            ""      $remote_addr;
          }

          # TLS terminates at the gateway; pass its scheme through when present.
          map $http_x_forwarded_proto $forwarded_proto {
            default $http_x_forwarded_proto;
            ""      $scheme;
          }

          # Per-user identity = trustworthy client address + User-Agent. Keys the
          # rate limiters and is stamped as X-Client-Fingerprint for the app's
          # per-user tenancy. $client_ip (not $remote_addr, which is the gateway)
          # is the real user, so all three controls agree on who a user is.
          limit_req_zone  "$client_ip$http_user_agent" zone=peruser:20m   rate=10r/s;
          limit_req_zone  "$client_ip$http_user_agent" zone=chat_user:20m rate=6r/m;
          limit_req_zone  "$client_ip"                 zone=chat_ip:10m   rate=12r/m;
          limit_conn_zone "$client_ip"                 zone=perip_conn:10m;
          limit_req_status 429;
          limit_conn_status 429;
          limit_req_log_level warn;

          server {
            listen       8080;
            server_name  _;
            client_max_body_size 2m;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
            add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
            # CSP is set per-request by the Next.js middleware (nonce-based script-src).

            error_page 429 = @rate_limited;

            # Shared upstream wiring, inherited by both locations below.
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Client-Fingerprint "$client_ip$http_user_agent";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffering off;
            proxy_read_timeout 65s;

            # The chatbot spends LLM tokens, so it gets a tight budget: 6/min per
            # user, 12/min per IP, at most 3 concurrent streams.
            location = /api/chat {
              limit_req  zone=chat_user burst=3 nodelay;
              limit_req  zone=chat_ip   burst=6 nodelay;
              limit_conn perip_conn 3;
              proxy_pass http://${EXPLORER_WEB_HOST}:${EXPLORER_WEB_PORT};
            }

            # Everything else: generous burst so page loads are not delayed.
            location / {
              limit_req zone=peruser burst=30 nodelay;
              proxy_pass http://${EXPLORER_WEB_HOST}:${EXPLORER_WEB_PORT};
            }

            location @rate_limited {
              default_type application/json;
              add_header Retry-After 60 always;
              return 429 '{"error":"Too many requests. Try again in a minute."}';
            }
          }
