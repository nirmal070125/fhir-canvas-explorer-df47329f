apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: explorer-nginx
  namespace: default
  annotations:
    openchoreo.dev/display-name: Explorer Edge Proxy
    openchoreo.dev/description: Security-header reverse proxy in front of the Next.js app.
spec:
  owner:
    projectName: fhir-canvas-explorer
  componentType:
    kind: ClusterComponentType
    name: deployment/web-application
  autoDeploy: true
  # Envoy's 15s default request timeout is too short for the chat tool loop;
  # nginx already allows 65s, so the edge route must exceed that.
  traits:
    - kind: ClusterTrait
      name: http-route-timeout
      instanceName: edge
      parameters:
        request: "75s"
