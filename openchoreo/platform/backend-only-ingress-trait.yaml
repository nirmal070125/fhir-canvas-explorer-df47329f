# ClusterTrait: backend-only-ingress
#
# Restricts a component so only one named backend component may reach it, on the
# container port. OpenChoreo's project visibility renders a NetworkPolicy with
# `podSelector: {}` (any pod in the cell) and the Service port, and trait
# patches don't stick to it — so this CREATES a dedicated NetworkPolicy instead.
# NetworkPolicies are additive: this one allows only <fromComponent> on <port>,
# and the generated policy (all pods -> Service port, where nothing listens)
# becomes a no-op. Used by wso2-fhir-server so only explorer-web's backend can
# reach it; the browser never appears as a pod source, so it is excluded too.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterTrait
metadata:
  name: backend-only-ingress
spec:
  parameters:
    openAPIV3Schema:
      type: object
      properties:
        fromComponent:
          type: string
          description: "Only pods of this component may reach the workload"
        port:
          type: integer
          description: "Container port to allow"
      required: [fromComponent, port]
  creates:
    - targetPlane: dataplane
      template:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: ${metadata.name}-${trait.instanceName}-backend-only
          namespace: ${metadata.namespace}
        spec:
          policyTypes: [Ingress]
          podSelector:
            matchLabels:
              openchoreo.dev/component: ${metadata.componentName}
              openchoreo.dev/environment: ${metadata.environmentName}
          ingress:
            - from:
                - podSelector:
                    matchLabels:
                      openchoreo.dev/component: ${parameters.fromComponent}
                      openchoreo.dev/environment: ${metadata.environmentName}
              ports:
                - protocol: TCP
                  port: ${parameters.port}
