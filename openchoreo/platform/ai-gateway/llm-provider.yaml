# Shared LLM provider (created once): upstream endpoint, credential, and access
# control. The ai-user-cost-budget trait's LlmProxies reference it by name
# (providerRef). Credential comes from the openai-provider-auth Secret, which
# provider-auth-external-secret.yaml builds from OpenBao. template: openai is a
# gateway built-in (others: anthropic, gemini, mistralai, azure-openai, …).
---
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: LlmProvider
metadata:
  name: openai-provider
  namespace: openchoreo-data-plane
spec:
  displayName: OpenAI Provider
  version: v1.0
  template: openai
  context: /openai-provider
  accessControl:
    mode: deny_all
    exceptions:
      - path: /v1/chat/completions
        methods: [POST]
      - path: /v1/models
        methods: [GET]
  # Host root, not .../v1 — clients send the full /v1/... wire path.
  upstream:
    url: https://api.openai.com
    auth:
      type: api-key
      header: Authorization
      value:
        valueFrom:
          name: openai-provider-auth
          key: authorization
