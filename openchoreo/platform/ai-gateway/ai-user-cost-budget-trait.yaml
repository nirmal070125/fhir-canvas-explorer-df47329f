# ClusterTrait: ai-user-cost-budget — routes a component's LLM traffic through
# the WSO2 AI gateway, enforces a per-user spend budget keyed on the forwarded
# X-Client-Fingerprint, and applies two in-gateway content guardrails. Creates an
# LlmProxy with: llm-cost (prices each request into x-llm-cost), advanced-ratelimit
# (charges x-llm-cost per fingerprint, 429 over budget), and two regex-guardrails
# (block jailbreak/write-intent prompts on request; block URLs in the answer).
# Costs run in nano-dollars (limit = budgetUsd * 1e9); memory backend resets on
# gateway restart. Guardrail blocks return HTTP 446.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterTrait
metadata:
  name: ai-user-cost-budget
spec:
  parameters:
    openAPIV3Schema:
      type: object
      properties:
        gatewayRuntimeName:
          type: string
          default: "api-platform-default-gateway-gateway-runtime"
        gatewayRuntimeNamespace:
          type: string
          default: "openchoreo-data-plane"
        gatewayRuntimePort:
          type: integer
          default: 8080
        providerRef:
          type: string
          default: "openai-provider"
          description: "Name of the platform-managed LlmProvider this proxy fronts"
        apiPath:
          type: string
          default: "/v1/chat/completions"
          description: "OpenAI wire path the policies match"
        fingerprintHeader:
          type: string
          default: "x-client-fingerprint"
          description: "Request header identifying the end user (the budget key)"
        budgetUsd:
          type: number
          default: 1.5
          description: "Per-user spend budget in USD per window"
        window:
          type: string
          default: "168h"
          description: "Budget window as a Go duration (168h = 1 week, 720h = 30 days)"
  validations:
    - rule: "${size(parameters.providerRef) > 0}"
      message: "providerRef must reference a deployed LlmProvider (e.g. openai-provider)"
  creates:
    - targetPlane: dataplane
      template:
        apiVersion: gateway.api-platform.wso2.com/v1alpha1
        kind: LlmProxy
        metadata:
          name: ${metadata.name}-${trait.instanceName}-llm
          namespace: ${metadata.namespace}
        spec:
          displayName: ${metadata.environmentName}-${metadata.componentName}-${trait.instanceName}
          version: v1.0
          context: /${metadata.environmentName}-${metadata.componentNamespace}-${metadata.componentName}-${trait.instanceName}
          provider:
            id: ${parameters.providerRef}
          # Request policies run top-down, response policies bottom-up. The prompt
          # guardrail is first so it gates before any spend; llm-cost is last so it
          # runs first on the response and writes x-llm-cost before advanced-ratelimit
          # charges it; the URL guardrail sits above them so a blocked reply is still billed.
          policies:
            # Read-only bot: block jailbreak phrasing and create/update/delete intent
            # on the latest user message (HTTP 422) before any tokens are spent.
            # No backslashes: the gateway JSON-unescapes \b to a backspace, so word
            # boundaries use [^a-z] classes (case-insensitive also excludes A-Z).
            - name: regex-guardrail
              version: v1
              paths:
                - path: ${parameters.apiPath}
                  methods: [POST]
                  params:
                    request:
                      enabled: true
                      # invert: block when the pattern MATCHES (denylist); the
                      # guardrail's default is allowlist (block when it does not).
                      invert: true
                      jsonPath: "$.messages[-1].content"
                      regex: "(?i)((ignore|disregard|forget).*(previous|prior|above).*(instruction|prompt|rule)|(^|[^a-z])(create|update|delete|patch|post|put|remove|drop)([^a-z]).*(patient|resource|record|observation|encounter))"
                      showAssessment: true
            # A clinical assistant should never emit links: block any URL in the answer.
            - name: regex-guardrail
              version: v1
              paths:
                - path: ${parameters.apiPath}
                  methods: [POST]
                  params:
                    response:
                      enabled: true
                      invert: true
                      jsonPath: "$.choices[0].message.content"
                      streamingJsonPath: "$.choices[0].delta.content"
                      regex: "https?://"
                      showAssessment: true
            - name: advanced-ratelimit
              version: v1
              paths:
                - path: ${parameters.apiPath}
                  methods: [POST]
                  params:
                    backend: memory
                    quotas:
                      - limits:
                          - limit: ${int(parameters.budgetUsd * 1000000000.0)}
                            duration: ${parameters.window}
                        keyExtraction:
                          - type: header
                            key: ${parameters.fingerprintHeader}
                        costExtraction:
                          enabled: true
                          default: 0
                          sources:
                            - type: response_metadata
                              key: x-llm-cost
                              multiplier: 1000000000
            - name: llm-cost
              version: v1
              paths:
                - path: ${parameters.apiPath}
                  methods: [POST]
  patches:
    - target:
        group: apps
        version: v1
        kind: Deployment
      operations:
        - op: add
          path: /spec/template/spec/containers/0/env/-
          value:
            name: OPENAI_BASE_URL
            value: "http://${parameters.gatewayRuntimeName}.${parameters.gatewayRuntimeNamespace}:${parameters.gatewayRuntimePort}/${metadata.environmentName}-${metadata.componentNamespace}-${metadata.componentName}-${trait.instanceName}"
        - op: add
          path: /spec/template/spec/containers/0/env/-
          value:
            name: OPENAI_API_KEY
            value: "managed-by-gateway"
