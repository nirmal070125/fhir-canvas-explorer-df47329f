# ClusterTrait: ai-user-cost-budget — routes a component's LLM traffic through the
# WSO2 AI gateway. Creates an LlmProxy with llm-cost (prices each request into
# x-llm-cost), advanced-ratelimit (charges it per X-Client-Fingerprint, 429 over
# budget), and a request regex-guardrail (blocks prompt-injection/jailbreak prompts, 422).
# No response guardrail: regex-guardrail fail-closes on absent JSONPath, and tool-call
# responses carry null content, so it would break the tool loop.
# Costs are nano-dollars (limit = budgetUsd * 1e9); memory backend resets on restart.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterTrait
metadata:
  name: ai-user-cost-budget
spec:
  parameters:
    openAPIV3Schema:
      type: object
      properties:
        gatewayRuntimeName:
          type: string
          default: "api-platform-default-gateway-gateway-runtime"
        gatewayRuntimeNamespace:
          type: string
          default: "openchoreo-data-plane"
        gatewayRuntimePort:
          type: integer
          default: 8080
        providerRef:
          type: string
          default: "openai-provider"
          description: "Name of the platform-managed LlmProvider this proxy fronts"
        apiPath:
          type: string
          default: "/v1/chat/completions"
          description: "OpenAI wire path the policies match"
        fingerprintHeader:
          type: string
          default: "x-client-fingerprint"
          description: "Request header identifying the end user (the budget key)"
        budgetUsd:
          type: number
          default: 1.5
          description: "Per-user spend budget in USD per window"
        window:
          type: string
          default: "168h"
          description: "Budget window as a Go duration (168h = 1 week, 720h = 30 days)"
  validations:
    - rule: "${size(parameters.providerRef) > 0}"
      message: "providerRef must reference a deployed LlmProvider (e.g. openai-provider)"
  creates:
    - targetPlane: dataplane
      template:
        apiVersion: gateway.api-platform.wso2.com/v1alpha1
        kind: LlmProxy
        metadata:
          name: ${metadata.name}-${trait.instanceName}-llm
          namespace: ${metadata.namespace}
        spec:
          displayName: ${metadata.environmentName}-${metadata.componentName}-${trait.instanceName}
          version: v1.0
          context: /${metadata.environmentName}-${metadata.componentNamespace}-${metadata.componentName}-${trait.instanceName}
          provider:
            id: ${parameters.providerRef}
          # Request policies run top-down, response policies bottom-up. The prompt
          # guardrail is first so it gates before any spend; llm-cost is last so it runs
          # first on the response and writes x-llm-cost before advanced-ratelimit charges it.
          policies:
            # Block prompt-injection/jailbreak phrasing in the user's question (HTTP 422)
            # before any spend. jsonPath targets messages[1] (the opening user turn;
            # [0] is the system prompt), not the last message — on tool-loop steps that
            # is the tool result, which should not be scanned as if it were a prompt.
            - name: regex-guardrail
              version: v1
              paths:
                - path: ${parameters.apiPath}
                  methods: [POST]
                  params:
                    request:
                      enabled: true
                      # invert: block when the pattern MATCHES (denylist); the
                      # guardrail's default is allowlist (block when it does not).
                      invert: true
                      jsonPath: "$.messages[1].content"
                      regex: "(?i)(ignore|disregard|forget).*(previous|prior|above).*(instruction|prompt|rule)"
                      showAssessment: true
            - name: advanced-ratelimit
              version: v1
              paths:
                - path: ${parameters.apiPath}
                  methods: [POST]
                  params:
                    backend: memory
                    quotas:
                      - limits:
                          - limit: ${int(parameters.budgetUsd * 1000000000.0)}
                            duration: ${parameters.window}
                        keyExtraction:
                          - type: header
                            key: ${parameters.fingerprintHeader}
                        costExtraction:
                          enabled: true
                          default: 0
                          sources:
                            - type: response_metadata
                              key: x-llm-cost
                              multiplier: 1000000000
            - name: llm-cost
              version: v1
              paths:
                - path: ${parameters.apiPath}
                  methods: [POST]
  patches:
    - target:
        group: apps
        version: v1
        kind: Deployment
      operations:
        - op: add
          path: /spec/template/spec/containers/0/env/-
          value:
            name: OPENAI_BASE_URL
            value: "http://${parameters.gatewayRuntimeName}.${parameters.gatewayRuntimeNamespace}:${parameters.gatewayRuntimePort}/${metadata.environmentName}-${metadata.componentNamespace}-${metadata.componentName}-${trait.instanceName}"
        - op: add
          path: /spec/template/spec/containers/0/env/-
          value:
            name: OPENAI_API_KEY
            value: "managed-by-gateway"
