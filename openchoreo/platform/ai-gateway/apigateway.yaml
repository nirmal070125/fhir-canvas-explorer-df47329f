# WSO2 APIGateway CR (gateway.api-platform.wso2.com, not the k8s Gateway API):
# instructs the operator to deploy the gateway runtime with the config from the
# module's gateway-configuration.yaml ConfigMap.
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: APIGateway
metadata:
  name: api-platform-default
  namespace: openchoreo-data-plane
spec:
  apiSelector:
    scope: Cluster
  infrastructure:
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
  storage:
    type: sqlite
  configRef:
    name: api-platform-operator-gateway-values
