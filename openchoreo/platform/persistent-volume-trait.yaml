# Platform setup, applied once per control plane: the v1.2 getting-started
# bundle ships no storage trait, so this installs the persistent-volume
# ClusterTrait (from openchoreo main's config/samples) that fhir-db uses for
# its data volume. The service ClusterComponentType must also allow it:
#   kubectl patch clustercomponenttype service --type=json -p '[{"op":"add",
#     "path":"/spec/allowedTraits/-",
#     "value":{"kind":"ClusterTrait","name":"persistent-volume"}}]'
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterTrait
metadata:
  name: persistent-volume
spec:
  parameters:
    # Full JSON Schema form: the shorthand ("volumeName: string") from newer
    # openchoreo main samples fails v1.2's CEL type check.
    openAPIV3Schema:
      type: object
      properties:
        volumeName:
          type: string
        mountPath:
          type: string
        containerName:
          type: string
          default: main

  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        size:
          type: string
          default: 10Gi
        # k3s/k3d default StorageClass; override per environment elsewhere.
        storageClass:
          type: string
          default: local-path

  creates:
    - targetPlane: dataplane
      template:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ${metadata.name}-${parameters.volumeName}
          namespace: ${metadata.namespace}
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: ${environmentConfigs.size}
          storageClassName: ${environmentConfigs.storageClass}

  patches:
    - target:
        group: apps
        version: v1
        kind: Deployment
      targetPlane: dataplane
      operations:
        - op: add
          path: /spec/template/spec/volumes/-
          value:
            name: ${parameters.volumeName}
            persistentVolumeClaim:
              claimName: ${metadata.name}-${parameters.volumeName}
        - op: add
          path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/volumeMounts/-
          value:
            name: ${parameters.volumeName}
            mountPath: ${parameters.mountPath}
