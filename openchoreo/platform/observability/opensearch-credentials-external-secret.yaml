# OpenSearch admin credentials for the logs module, sourced from OpenBao
# (seed with: bao kv put secret/opensearch-username value=- and
# secret/opensearch-password value=- ; see setup.sh).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-admin-credentials
  namespace: openchoreo-observability-plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: default
  target:
    name: opensearch-admin-credentials
  data:
    - secretKey: username
      remoteRef:
        key: opensearch-username
        property: value
    - secretKey: password
      remoteRef:
        key: opensearch-password
        property: value
