observer:
  secretName: observer-secrets
  controlPlaneApiUrl: http://openchoreo-api.openchoreo-control-plane.svc.cluster.local:8080
  extraEnvs:
    - name: OBSERVER_BASE_URL
      value: http://observer.openchoreo.localhost:11080
    - name: AUTHZ_TIMEOUT
      value: "30s"
  http:
    hostnames:
      - observer.openchoreo.localhost
gateway:
  httpPort: 11080
  tls:
    enabled: false
