# Platform setup, applied once per data plane: makes Envoy determine the
# client address from the TCP socket (useRemoteAddress), sanitize spoofable
# inbound headers, and emit x-envoy-external-address, which the nginx tier
# forwards as X-Real-IP for the app's rate limiter.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: HTTPListenerPolicy
metadata:
  name: client-address
  namespace: openchoreo-data-plane
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-default
  useRemoteAddress: true
