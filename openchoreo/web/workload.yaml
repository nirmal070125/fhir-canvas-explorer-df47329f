apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: explorer-web-workload
  namespace: default
spec:
  owner:
    projectName: fhir-canvas-explorer
    componentName: explorer-web
  endpoints:
    http:
      type: HTTP
      port: 3000
      visibility: [project]
  dependencies:
    endpoints:
      - component: fhir-server
        name: http
        visibility: project
        envBindings:
          address: FHIR_SERVER_ORIGIN
  container:
    image: host.k3d.internal:10082/default-fhir-canvas-explorer-explorer-web:v1-a713df8e
    env:
      # Must stay the short service name: fhir-server's BASE_URL embeds this
      # origin in pagination links, and $(FHIR_SERVER_ORIGIN) cannot be
      # referenced here — workload env lands in an envFrom ConfigMap, where
      # Kubernetes performs no variable expansion.
      - key: FHIR_ALLOWED_ORIGINS
        value: http://fhir-server:9090
      - key: FHIR_MCP_IDLE_TTL_MS
        value: "300000"
