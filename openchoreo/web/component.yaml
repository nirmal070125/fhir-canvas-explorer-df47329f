apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: explorer-web
  namespace: default
  annotations:
    openchoreo.dev/display-name: Explorer Web App
    openchoreo.dev/description: Next.js UI and API routes with the embedded FHIR MCP subprocess.
spec:
  owner:
    projectName: fhir-canvas-explorer
  componentType:
    kind: ClusterComponentType
    name: deployment/service
  autoDeploy: true
  # LLM calls go east-west through the WSO2 AI gateway (see platform/ai-gateway):
  # the trait injects OPENAI_BASE_URL and the credential stays at the gateway.
  traits:
    - kind: ClusterTrait
      name: ai-llm-proxy
      instanceName: llm
      parameters:
        providerRef: openai-provider
  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: "https://github.com/prdai-archive/wso2-fhir-canvas-explorer-df47329f"
        revision:
          branch: "feat/openchoreo-deployment" # until this PR merges to main
        appPath: "/"
      docker:
        context: "/"
        filePath: "/Dockerfile"
