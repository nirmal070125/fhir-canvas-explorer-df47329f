apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: wso2-fhir-server
  namespace: default
  annotations:
    openchoreo.dev/display-name: FHIR R4 Server
    openchoreo.dev/description: Go FHIR R4 server backed by postgres.
spec:
  owner:
    projectName: fhir-canvas-explorer
  componentType:
    kind: ClusterComponentType
    name: deployment/service
  autoDeploy: true
  # Whitelist the cell NetworkPolicy to explorer-web's backend only, on the
  # container port; see platform/backend-only-ingress-trait.yaml.
  traits:
    - kind: ClusterTrait
      name: backend-only-ingress
      instanceName: netpol
      parameters:
        fromComponent: explorer-web
        port: 9090
  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: "https://github.com/wso2/fhir-server"
        revision:
          branch: "main"
        appPath: "/"
      docker:
        context: "/"
        filePath: "/Dockerfile"
