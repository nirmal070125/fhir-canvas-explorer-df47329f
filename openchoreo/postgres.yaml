apiVersion: openchoreo.dev/v1alpha1
kind: Resource
metadata:
  name: fhir-postgres
  namespace: default
spec:
  owner:
    projectName: fhir-canvas-explorer
  type:
    kind: ClusterResourceType
    name: postgres
  parameters:
    database: fhirdb
---
apiVersion: openchoreo.dev/v1alpha1
kind: ResourceReleaseBinding
metadata:
  name: fhir-postgres-development
  namespace: default
  labels:
    openchoreo.dev/project: fhir-canvas-explorer
    openchoreo.dev/environment: development
spec:
  owner:
    projectName: fhir-canvas-explorer
    resourceName: fhir-postgres
  environment: development
  # Pin to the current ResourceRelease after the first apply (content-hashed).
