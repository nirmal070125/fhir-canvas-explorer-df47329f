# SecretReferences materialize entries from the platform's configured secret
# store (External Secrets Operator) into K8s Secrets on the data plane; the
# Workloads consume them via valueFrom.secretKeyRef. The remoteRef keys below
# name entries that must exist in the store — nothing sensitive lives in git.
apiVersion: openchoreo.dev/v1alpha1
kind: SecretReference
metadata:
  name: openai-credentials
  namespace: default
spec:
  template:
    type: Opaque
  data:
    - secretKey: apiKey
      remoteRef:
        key: fhir-canvas-explorer-openai-api-key
        property: value
  refreshInterval: 1h
---
apiVersion: openchoreo.dev/v1alpha1
kind: SecretReference
metadata:
  name: fhir-db-credentials
  namespace: default
spec:
  template:
    type: Opaque
  data:
    # e.g. postgres://fhir:<password>@fhir-db:5432/fhirdb?sslmode=disable
    - secretKey: databaseUrl
      remoteRef:
        key: fhir-canvas-explorer-database-url
        property: value
    - secretKey: password
      remoteRef:
        key: fhir-canvas-explorer-db-password
        property: value
  refreshInterval: 1h
