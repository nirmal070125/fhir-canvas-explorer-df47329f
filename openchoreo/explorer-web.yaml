# App tier: Next.js UI + API routes (FHIR proxy, chatbot). Project-visible
# only — external traffic must come through explorer-nginx. The FHIR MCP
# server is not a component: it runs as a stdio child process inside this
# container (see src/lib/server/fhir-mcp.ts), so nothing else can reach it.
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: explorer-web
  namespace: default
  annotations:
    openchoreo.dev/display-name: Explorer Web App
    openchoreo.dev/description: Next.js UI and API routes with the embedded FHIR MCP subprocess.
spec:
  owner:
    projectName: fhir-canvas-explorer
  componentType:
    kind: ClusterComponentType
    name: deployment/service
  autoDeploy: true
  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: "https://github.com/prdai-archive/wso2-fhir-canvas-explorer-df47329f"
        revision:
          branch: "feat/openchoreo-deployment" # until this PR merges to main
        appPath: "/"
      docker:
        context: "/"
        filePath: "/Dockerfile"
---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: explorer-web
  namespace: default
spec:
  owner:
    projectName: fhir-canvas-explorer
    componentName: explorer-web
  endpoints:
    http:
      type: HTTP
      port: 3000
      visibility: [project]
  container:
    # Placeholder; the dockerfile-builder WorkflowRun output image replaces it.
    image: ghcr.io/prdai-archive/fhir-canvas-explorer-web:latest
    env:
      # SSRF allowlist for the /api/fhir proxy: only the in-cluster FHIR server.
      - key: FHIR_ALLOWED_ORIGINS
        value: http://fhir-server:9090
      - key: FHIR_MCP_IDLE_TTL_MS
        value: "300000"
      - key: OPENAI_API_KEY
        valueFrom:
          secretKeyRef:
            name: openai-credentials
            key: apiKey
