# Edge tier: nginx security-header proxy, the only externally visible endpoint.
# OpenChoreo's gateway terminates TLS and load-balances in front of it; nginx
# keeps the WSO2 security headers and forwards to the explorer-web component.
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: explorer-nginx
  namespace: default
  annotations:
    openchoreo.dev/display-name: Explorer Edge Proxy
    openchoreo.dev/description: Security-header reverse proxy in front of the Next.js app.
spec:
  owner:
    projectName: fhir-canvas-explorer
  componentType:
    kind: ClusterComponentType
    name: deployment/web-application
  autoDeploy: true
  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: "https://github.com/prdai-archive/wso2-fhir-canvas-explorer-df47329f"
        revision:
          branch: "feat/openchoreo-deployment" # until this PR merges to main
        appPath: "/deploy/nginx"
      docker:
        context: "/deploy/nginx"
        filePath: "/deploy/nginx/Dockerfile"
---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: explorer-nginx
  namespace: default
spec:
  owner:
    projectName: fhir-canvas-explorer
    componentName: explorer-nginx
  endpoints:
    http:
      type: HTTP
      port: 8080
      visibility: [external]
  container:
    # Placeholder; the dockerfile-builder WorkflowRun output image replaces it.
    image: ghcr.io/prdai-archive/fhir-canvas-explorer-nginx:latest
    env:
      # Component service DNS inside the project cell.
      - key: EXPLORER_WEB_UPSTREAM
        value: explorer-web:3000
