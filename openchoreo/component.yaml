apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: explorer-web
  namespace: default
  annotations:
    openchoreo.dev/display-name: Explorer Web App
    openchoreo.dev/description: Next.js UI + API routes, served behind nginx on 8080.
spec:
  owner:
    projectName: fhir-canvas-explorer
  type: WebApplication
  build:
    repository:
      url: https://github.com/nirmal070125/fhir-canvas-explorer-df47329f
      revision:
        branch: main
      appPath: .
    templateRef:
      # Uses the repo Dockerfile (multi-stage bun build + nginx runner).
      name: docker
      parameters:
        - name: docker-context
          value: .
        - name: dockerfile-path
          value: ./Dockerfile
