server {
  listen       8080;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # ── Security response headers (WSO2 secure-engineering guidelines) ──────────
  # Applied server-wide. nginx only inherits add_header into a location that
  # defines no add_header of its own, so any location below that sets its own
  # add_header must re-declare these (see `location = /index.html`).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  # connect-src allows the same-origin proxied API plus any https FHIR endpoint a
  # user points the explorer at. Relax connect-src if you must target http:// servers.
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  # Reverse-proxy the FHIR API to the in-cluster fhir-server Service.
  # OpenChoreo places all Components in one Project into the same dp-*
  # namespace, so "fhir-server" resolves via in-cluster DNS to the Service
  # the fhir-server Workload's endpoint produces. From the browser's view
  # this is same-origin with the UI — no CORS work needed, and the UI's
  # DEFAULT_BASE_URL = "/fhir/r4" works out of the box.
  location /fhir/r4 {
    # Explicit request-body cap for the API proxy. nginx defaults to 1m, which
    # rejects FHIR transaction bundles (e.g. the sample-data loader) with 413.
    # 2m fits the bundled sample data with headroom while still bounding request
    # size (DoS control). Raise only if you POST larger bundles.
    client_max_body_size 2m;
    proxy_pass http://fhir-server:9090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback — all unknown paths return index.html so the client-side
  # router can handle them.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache fingerprinted assets emitted by Vite. Uses `expires` (not
  # add_header) so it keeps inheriting the security headers above.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Never cache the entry HTML — keeps users on the latest deploy. This sets
  # add_header, so the security headers are re-declared here too.
  location = /index.html {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
}
