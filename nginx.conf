server {
  listen       8080;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # Reverse-proxy the FHIR API to the in-cluster fhir-server Service.
  # OpenChoreo places all Components in one Project into the same dp-*
  # namespace, so "fhir-server" resolves via in-cluster DNS to the Service
  # the fhir-server Workload's endpoint produces. From the browser's view
  # this is same-origin with the UI — no CORS work needed, and the UI's
  # DEFAULT_BASE_URL = "/fhir/r4" works out of the box.
  location /fhir/r4 {
    proxy_pass http://fhir-server:9090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback — all unknown paths return index.html so the client-side
  # router can handle them.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache fingerprinted assets emitted by Vite.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never cache the entry HTML — keeps users on the latest deploy.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
