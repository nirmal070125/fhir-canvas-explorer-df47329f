pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  limit_req_zone "$binary_remote_addr$http_user_agent" zone=peruser:20m rate=10r/s;
  limit_req_zone "$binary_remote_addr$http_user_agent" zone=chat_user:20m rate=6r/m;
  limit_req_zone $binary_remote_addr zone=chat_ip:10m rate=12r/m;
  limit_conn_zone $binary_remote_addr zone=perip_conn:10m;
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_log_level warn;

  server {
    listen       8080;
    server_name  _;
    client_max_body_size 2m;

    # ── Security response headers (WSO2 secure-engineering guidelines) ────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # External FHIR requests pass through the same-origin Next.js proxy. Next.js
    # emits inline bootstrap scripts, so script-src allows application scripts.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    error_page 429 = @rate_limited;

    # Next.js serves both the application and the server-side chatbot endpoint.
    location / {
      limit_req zone=peruser burst=30 nodelay;
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Client-Fingerprint "$remote_addr$http_user_agent";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 65s;
    }

    # The chatbot endpoint spends LLM tokens per request and holds a stream
    # open, so it gets a much tighter budget and a concurrent-stream cap.
    location = /api/chat {
      limit_req zone=chat_user burst=3 nodelay;
      limit_req zone=chat_ip burst=6 nodelay;
      limit_conn perip_conn 3;
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Client-Fingerprint "$remote_addr$http_user_agent";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 65s;
    }

    location @rate_limited {
      default_type application/json;
      add_header Retry-After 60 always;
      return 429 '{"error":"Too many requests. Try again in a minute."}';
    }
  }
}
