server {
  listen       8080;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # SPA fallback — all unknown paths return index.html so the client-side
  # router can handle them.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache fingerprinted assets emitted by Vite.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never cache the entry HTML — keeps users on the latest deploy.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
